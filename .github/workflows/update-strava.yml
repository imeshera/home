name: Update Strava Activities

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  update-strava:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Fetch Strava Activities
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: |
          TOKEN_RESPONSE=$(curl -s -X POST https://www.strava.com/oauth/token \
            -d client_id=$STRAVA_CLIENT_ID \
            -d client_secret=$STRAVA_CLIENT_SECRET \
            -d refresh_token=$STRAVA_REFRESH_TOKEN \
            -d grant_type=refresh_token)
          
          ACCESS_TOKEN=$(echo $TOKEN_RESPONSE | jq -r '.access_token')
          
          curl -s -X GET "https://www.strava.com/api/v3/athlete/activities?per_page=5" \
            -H "Authorization: Bearer $ACCESS_TOKEN" > strava-activities.json
          
          cat strava-activities.json | jq '.' > strava-activities-temp.json
          mv strava-activities-temp.json strava-activities.json
      
      - name: Commit and push if changed
        run: |
          git config user.name 'Strava Bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add strava-activities.json
          if ! git diff --quiet HEAD strava-activities.json 2>/dev/null; then
            git commit -m "Update Strava activities [skip ci]"
            git push origin main
          fi
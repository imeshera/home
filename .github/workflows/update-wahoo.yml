name: Update Wahoo Activities

on:
  schedule:
    - cron: '*/15 * * * *'  # Every 15 minutes
  workflow_dispatch:

jobs:
  update-wahoo:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Fetch Wahoo Activities
        env:
          WAHOO_CLIENT_ID: ${{ secrets.WAHOO_CLIENT_ID }}
          WAHOO_CLIENT_SECRET: ${{ secrets.WAHOO_CLIENT_SECRET }}
          WAHOO_REFRESH_TOKEN: ${{ secrets.WAHOO_REFRESH_TOKEN }}
        run: |
          # Use refresh token from file if it exists, otherwise use secret
          if [ -f wahoo-token.txt ]; then
            REFRESH_TOKEN=$(cat wahoo-token.txt | tr -d '\n\r ')
            echo "Using refresh token from file"
          else
            REFRESH_TOKEN=$WAHOO_REFRESH_TOKEN
            echo "Using refresh token from secret (first run)"
          fi
          
          # Get new access token and new refresh token
          TOKEN_RESPONSE=$(curl -s -X POST https://api.wahooligan.com/oauth/token \
            -H "Content-Type: application/x-www-form-urlencoded" \
            -d "client_id=$WAHOO_CLIENT_ID" \
            -d "client_secret=$WAHOO_CLIENT_SECRET" \
            -d "refresh_token=$REFRESH_TOKEN" \
            -d "grant_type=refresh_token")
          
          ACCESS_TOKEN=$(echo $TOKEN_RESPONSE | jq -r '.access_token')
          NEW_REFRESH_TOKEN=$(echo $TOKEN_RESPONSE | jq -r '.refresh_token')
          
          if [ "$ACCESS_TOKEN" = "null" ] || [ -z "$ACCESS_TOKEN" ]; then
            echo "Failed to get access token"
            echo "Token response: $TOKEN_RESPONSE"
            echo ""
            echo "This usually means your refresh token has expired."
            echo "To fix this:"
            echo "1. Go to https://developers.wahooligan.com/"
            echo "2. Get new OAuth credentials"
            echo "3. Use the token generator tool to get a new refresh token"
            echo "4. Update your GitHub secrets with the new refresh token"
            echo "5. Delete wahoo-token.txt from the repository"
            exit 1
          fi
          
          # Save the new refresh token for next time (without newline)
          echo -n $NEW_REFRESH_TOKEN > wahoo-token.txt
          echo "Saved new refresh token to file"
          
          # Fetch last 5 workouts
          curl -s -X GET "https://api.wahooligan.com/v1/workouts?per_page=5" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" > wahoo-activities.json
          
          # Pretty print the JSON
          cat wahoo-activities.json | jq '.' > wahoo-activities-temp.json
          mv wahoo-activities-temp.json wahoo-activities.json
      
      - name: Commit and push if changed
        run: |
          git config user.name 'Wahoo Bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Add both files first
          git add wahoo-activities.json wahoo-token.txt
          
          # Check if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            # Pull with rebase strategy, auto-stash changes
            git pull --rebase --autostash origin main || true
            
            # Commit and push
            git commit -m "Update Wahoo activities and refresh token [skip ci]"
            git push origin main
          fi